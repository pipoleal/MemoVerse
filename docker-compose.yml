# Local development orchestration for MemoVerse: Postgres + the Django
# backend (built from backend/Dockerfile). The frontend is NOT included on
# purpose — there is no frontend Dockerfile in this repo, and the project's
# established local workflow runs it directly with `npm run dev` (see
# frontend/README.md). This file is for local dev only; production runs on
# Render from backend/Dockerfile directly, without Compose.
#
# Usage:
#   1. Copy backend/.env.example to backend/.env and fill in real values
#      (Mercado Pago sandbox credentials, etc.) if you haven't already.
#   2. docker compose up --build
#   3. Backend: http://127.0.0.1:8000  |  Postgres: 127.0.0.1:5432
#
# DATABASE_URL below always wins over whatever backend/.env has (Compose
# `environment:` overrides `env_file:` for the same key), so the backend
# talks to THIS Postgres container even if backend/.env is empty/unset —
# your local `manage.py runserver` outside Docker is unaffected and keeps
# using SQLite as before.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memoverse
      POSTGRES_USER: memoverse
      POSTGRES_PASSWORD: memoverse
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoverse -d memoverse"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    # Overrides the Dockerfile's production CMD (gunicorn) with the Django
    # dev server, which live-reloads from the mounted volume below —
    # gunicorn would need a container rebuild on every code change instead.
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend/app:/app
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgres://memoverse:memoverse@db:5432/memoverse
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
